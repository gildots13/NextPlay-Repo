<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NextPlay</title>

    <style>
        body{
            background:#141414;
            color:white;
            font-family:Arial;
            padding:20px;
        }

        input{
            padding:10px;
            width:300px;
        }

        button{
            padding:10px;
            cursor:pointer;
        }

        .card{
            background:#1f1f1f;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
        }

        a{
            color:#ff4444;
            margin-right:10px;
        }
    </style>
</head>
<body>

<h1>NextPlay</h1>

<form method="GET">

    <input
        type="text"
        name="busca"
        placeholder="Buscar filme..."
        value="{{ busca|default:'' }}"
    >

    <button type="submit">
        Buscar
    </button>

</form>

<hr>

{% for filme in filmes %}

    <div class="card">

    <img
        src="https://image.tmdb.org/t/p/w500{{ filme.poster_path }}"
        width="200"
    >

    <h2>{{ filme.title }}</h2>

    <p>
        Ano:
        {{ filme.release_year }}
    </p>

    <p>
        Nota:
        {{ filme.vote_average }}
    </p>

</div>

{% endfor %}

<div>

    {% if filmes.has_previous %}
        <a href="?page={{ filmes.previous_page_number }}">
            Anterior
        </a>
    {% endif %}

    Página {{ filmes.number }}

    {% if filmes.has_next %}
        <a href="?page={{ filmes.next_page_number }}">
            Próxima
        </a>
    {% endif %}

</div>

</body>
</html>
